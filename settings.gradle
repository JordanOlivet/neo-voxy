pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
            }
        }
    }
}

// Auto-provision the Java 21 toolchain (downloads a JDK if none is detected),
// so the build works on a machine that only has an older/launcher JVM. See
// scripts/setup-dev.sh.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// MultiLoader Template layout (ADR-007): loader-agnostic code in common, thin
// loader projects that compile the common sources against their own classpath.
rootProject.name = 'neo-voxy'
include('common')
include('neoforge')
