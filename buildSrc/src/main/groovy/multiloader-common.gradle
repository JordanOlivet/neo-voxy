// Shared by every project (common and loaders): Java toolchain, repositories
// and the plain Java libraries Voxy bundles into its jars.
plugins {
    id 'java-library'
}

version = mod_version
group = maven_group

base {
    archivesName = "${archives_base_name}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
    options.deprecation = true
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fabric'
                url = 'https://maven.fabricmc.net'
            }
        }
        filter { includeGroupAndSubgroups('net.fabricmc') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
}

configurations {
    // Plain Java libraries shaded into the loader jars. Minecraft ships LWJGL
    // core but not the lmdb/zstd modules, and none of the storage backends.
    bundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjgl_version}")

    // Natives for Windows and Linux only (ADR-004).
    bundle(implementation("org.lwjgl:lwjgl-lmdb")) { transitive = false }
    bundle(implementation("org.lwjgl:lwjgl-zstd")) { transitive = false }
    bundle("org.lwjgl:lwjgl-lmdb:${lwjgl_version}:natives-windows") { transitive = false }
    bundle("org.lwjgl:lwjgl-zstd:${lwjgl_version}:natives-windows") { transitive = false }
    bundle("org.lwjgl:lwjgl-lmdb:${lwjgl_version}:natives-linux") { transitive = false }
    bundle("org.lwjgl:lwjgl-zstd:${lwjgl_version}:natives-linux") { transitive = false }

    // Storage backends
    bundle(implementation('org.rocksdb:rocksdbjni:8.10.0')) { transitive = false }
    bundle(implementation('redis.clients:jedis:5.1.0')) { transitive = false }
    bundle(implementation('org.apache.commons:commons-pool2:2.12.0')) { transitive = false }
    bundle(implementation('org.tukaani:xz:1.10')) { transitive = false }
    // sqlite-jdbc: required for DHImporter (Distant Horizons SQLite databases)
    bundle(implementation('org.xerial:sqlite-jdbc:3.46.1.3')) { transitive = false }
    // LZ4 is provided by Minecraft, do not bundle
    compileOnly 'org.lz4:lz4-java:1.8.0'
}
