# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true
org.gradle.parallel=true

# Project
mod_version=1.3.0
maven_group=me.cortex
archives_base_name=neo-voxy
mod_id=voxy
java_version=21

# Minecraft
minecraft_version=1.21.1
# Vanilla 1.21.1 in Mojang mappings for the common project:
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430

# NeoForge
# Dev and compile version. Sodium 0.6.13 bundles Forgified Fabric API modules
# that require 21.1.115+, so older builds cannot run it in dev.
neoforge_version=21.1.229

# Bundled native libraries
lwjgl_version=3.3.3

# Mod dependencies (Modrinth Maven coordinates)
sodium_neoforge_version=mc1.21.1-0.6.13-neoforge
# Sodium 0.8.x config API, compiled into the sodium8 source set only (ADR-003)
sodium8_neoforge_version=mc1.21.1-0.8.12-neoforge
iris_neoforge_version=1.8.0+1.21.1-neoforge
# Iris for dev runs (-PwithIris): 1.8.0 does not apply on Sodium 0.6.13.
iris_neoforge_dev_version=1.8.12+1.21.1-neoforge
lithium_neoforge_version=mc1.21.1-0.15.0-neoforge
# Chunky 1.4.23: Modrinth version ids, because the version number alone resolves
# to the Forge jar.
chunky_neoforge_version=LuFhm4eU
