plugins {
    id 'dev.architectury.loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.neoforged.net/releases" }
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

loom {
    accessWidenerPath = file("src/main/resources/voxy.accesswidener")
}

// Sodium 0.8.x replaced the options GUI that MixinSodiumOptionsGUI hooks with a
// registration API (net.caffeinemc.mods.sodium.api.config) that does not exist in
// 0.6.x. The 0.8 entry point therefore lives in its own source set compiled
// against 0.8.12, while the main source set keeps targeting 0.6.13. Both paths end
// up in the same jar and each is dormant on the Sodium branch it does not match.
sourceSets {
    sodium8 {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
}

configurations {
    bundle {
        canBeResolved = true
        canBeConsumed = false
    }
    // Resolves the Sodium 0.8.x artifact for extraction only; never a compile or
    // runtime classpath itself.
    sodium8Api {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

// Sodium 0.8.x moved its actual mod classes into a nested JarJar and left only
// the bootstrap service in the outer jar, so depending on the artifact directly
// exposes none of the config API. Unpack the inner jar instead. It ships in
// Mojang mappings already, which is what NeoForge runs, so it needs no remapping
// and can be a plain compileOnly dependency.
def extractSodium8Api = tasks.register("extractSodium8Api", Copy) {
    from { zipTree(configurations.sodium8Api.singleFile).matching { include "META-INF/jarjar/*-mod.jar" } }
    into layout.buildDirectory.dir("sodium8-api")
    eachFile { it.relativePath = new RelativePath(true, it.name) }
    includeEmptyDirs = false
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

dependencies {
    // Minecraft and mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    // Sodium for NeoForge (required dependency)
    modImplementation "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    // The 0.8.x config API, compile-only and scoped to the sodium8 source set, so
    // nothing outside it can accidentally link against 0.8-only classes.
    sodium8Api "maven.modrinth:sodium:mc1.21.1-0.8.12-neoforge"
    sodium8CompileOnly fileTree(dir: layout.buildDirectory.dir("sodium8-api"), include: "*.jar")
            .builtBy(extractSodium8Api)
    // Sodium's bundled JarJars (service + Fabric API renderer modules)
    // Loom dev environment doesn't extract NeoForge JarJars at runtime, so add them explicitly
    runtimeOnly fileTree(dir: "libs", include: "*.jar")
    forgeRuntimeLibrary fileTree(dir: "libs", include: "*.jar")

    // Optional: Iris shaders support
    modCompileOnly("maven.modrinth:iris:1.8.0+1.21.1-neoforge")

    // Optional: Lithium support (for LithiumHashPalette compatibility)
    modCompileOnly("maven.modrinth:lithium:mc1.21.1-0.15.0-neoforge")

    // Optional: Nvidium support — no NeoForge build for 1.21.1 published as of 2026-04
    //modCompileOnly "maven.modrinth:nvidium:0.3.0-beta"

    // Optional: Chunky integration (auto-ingest generated chunks into Voxy).
    // Modrinth Maven resolves "chunky:1.4.23" to the Forge jar; the NeoForge jar
    // (containing NeoForgeWorld) is stored locally under libs/chunky-nf/.
    modCompileOnly fileTree(dir: "libs/chunky-nf", include: "*.jar")
}

shadowJar {
    exclude "fabric.mod.json"
    configurations = [project.configurations.bundle]
    archiveClassifier.set("dev-shadow")
    from sourceSets.sodium8.output
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    atAccessWideners.add('voxy.accesswidener')
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

project.ext.lwjglVersion = "3.3.3"
project.ext.lwjglNatives = "natives-windows"

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    forgeRuntimeLibrary "org.lwjgl:lwjgl"
    bundle(implementation("org.lwjgl:lwjgl-lmdb")) { transitive = false }
    forgeRuntimeLibrary "org.lwjgl:lwjgl-lmdb"
    bundle(implementation("org.lwjgl:lwjgl-zstd")) { transitive = false }
    forgeRuntimeLibrary "org.lwjgl:lwjgl-zstd"

    forgeRuntimeLibrary "org.lwjgl:lwjgl:$lwjglVersion:natives-windows"
    forgeRuntimeLibrary "org.lwjgl:lwjgl:$lwjglVersion:natives-linux"
    bundle(forgeRuntimeLibrary("org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows")) { transitive = false }
    bundle(forgeRuntimeLibrary("org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows")) { transitive = false }
    bundle(forgeRuntimeLibrary("org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux")) { transitive = false }
    bundle(forgeRuntimeLibrary("org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux")) { transitive = false }

    // Storage backends
    bundle(implementation('org.rocksdb:rocksdbjni:8.10.0')) { transitive = false }
    forgeRuntimeLibrary 'org.rocksdb:rocksdbjni:8.10.0'
    bundle(implementation('redis.clients:jedis:5.1.0')) { transitive = false }
    forgeRuntimeLibrary 'redis.clients:jedis:5.1.0'
    bundle(implementation('org.apache.commons:commons-pool2:2.12.0')) { transitive = false }
    forgeRuntimeLibrary 'org.apache.commons:commons-pool2:2.12.0'
    // LZ4 is provided by Minecraft/NeoForge, do not bundle
    compileOnly 'org.lz4:lz4-java:1.8.0'
    bundle(implementation('org.tukaani:xz:1.10')) { transitive = false }
    forgeRuntimeLibrary 'org.tukaani:xz:1.10'
    // sqlite-jdbc: required for DHImporter (Distant Horizons SQLite databases)
    bundle(implementation('org.xerial:sqlite-jdbc:3.46.1.3')) { transitive = false }
    forgeRuntimeLibrary 'org.xerial:sqlite-jdbc:3.46.1.3'

    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.lz4:lz4-java:1.8.0'
    testRuntimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-windows"
    testRuntimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-linux"
    testRuntimeOnly "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    testRuntimeOnly "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"
    testRuntimeOnly "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows"
    testRuntimeOnly "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux"
}

test {
    useJUnitPlatform()
}
