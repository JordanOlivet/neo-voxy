plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'com.github.johnrengelman.shadow'
}

// Sodium 0.8.x replaced the options GUI that MixinSodiumOptionsGUI hooks with a
// registration API (net.caffeinemc.mods.sodium.api.config) that does not exist in
// 0.6.x. The 0.8 entry point therefore lives in its own source set compiled
// against 0.8.12, while the main source set keeps targeting 0.6.13. Both paths end
// up in the same jar and each is dormant on the Sodium branch it does not match
// (ADR-003).
sourceSets {
    sodium8 {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version
    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            // ./gradlew :neoforge:runClient -PquickPlay=<save name> loads a world directly.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            }
            // -PauditMixins forces every mixin to apply at client setup (VoxyClient).
            if (project.hasProperty('auditMixins')) {
                systemProperty('voxy.auditMixins', 'true')
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.sodium8
        }
    }
}

configurations {
    commonSodium8Java {
        canBeResolved = true
    }
}

dependencies {
    // Sodium is required on the client; dev runs use 0.6.x. The 0.8.x jar
    // cannot run in dev: its outer bootstrap jar and nested mod jar must be
    // loaded on separate layers, which only a real install does.
    compileOnly "maven.modrinth:sodium:${sodium_neoforge_version}"
    runtimeOnly "maven.modrinth:sodium:${sodium_neoforge_version}"
    // Optional integrations, compile-only. -PwithIris adds Iris to dev runs.
    compileOnly "maven.modrinth:iris:${iris_neoforge_version}"
    if (project.hasProperty('withIris')) {
        runtimeOnly "maven.modrinth:iris:${iris_neoforge_dev_version}"
    }
    compileOnly "maven.modrinth:lithium:${lithium_neoforge_version}"
    compileOnly "maven.modrinth:chunky:${chunky_neoforge_version}"

    // The 0.8.x config API (extracted by common), scoped to the sodium8 source
    // set so nothing outside it can accidentally link against 0.8-only classes.
    sodium8CompileOnly project(path: ':common', configuration: 'sodium8Api')
    commonSodium8Java project(path: ':common', configuration: 'commonSodium8Java')
}

tasks.named('compileSodium8Java', JavaCompile) {
    dependsOn(configurations.commonSodium8Java)
    source(configurations.commonSodium8Java)
}

// Plain libraries are not visible to mods in dev runs unless added here.
configurations.additionalRuntimeClasspath.extendsFrom configurations.bundle

// The bundled lwjgl-lmdb/zstd modules require LWJGL core, which the client
// ships but a dedicated server does not.
configurations {
    serverLwjgl {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    serverLwjgl "org.lwjgl:lwjgl:${lwjgl_version}"
    serverLwjgl "org.lwjgl:lwjgl:${lwjgl_version}:natives-windows"
    serverLwjgl "org.lwjgl:lwjgl:${lwjgl_version}:natives-linux"
}
neoForge.runs.server.additionalRuntimeClasspathConfiguration.extendsFrom configurations.serverLwjgl

// The shipped jar: common + NeoForge classes, the sodium8 entry point and the
// bundled libraries. NeoForge 1.21.1 runs Mojang mappings, so no remapping step.
shadowJar {
    configurations = [project.configurations.bundle]
    from sourceSets.sodium8.output
    archiveClassifier.set('')
    // Fabric-only metadata coming from the common resources.
    exclude 'voxy.accesswidener'
    // A bundled library's module descriptor must not name the mod's module.
    exclude '**/module-info.class'
}

jar {
    archiveClassifier.set('slim')
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}

assemble.dependsOn shadowJar
